<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Progrés sondes · Instalacions JFA</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#EEF2F1;
  --surface:#FFFFFF;
  --ink:#10242B;
  --ink-soft:#56686D;
  --ink-faint:#8B9A9D;
  --line:#DCE4E2;
  --accent:#0E7C86;
  --accent-dark:#0A5F67;
  --danger:#B3261E;
  --danger-soft:#FBE7E5;
  --ok:#1F8A4C;
  --radius:10px;
  --radius-sm:7px;
  --shadow:0 1px 2px rgba(16,36,43,0.06),0 6px 16px rgba(16,36,43,0.06);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
}

*{box-sizing:border-box;}

body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
  margin:0;
  padding-bottom:60px;
}

.topbar{
  background:var(--surface);
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:60;
}

.topbar-inner{
  max-width:1400px;
  margin:auto;
  padding:12px 20px;
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
}

.brand{
  display:flex;
  align-items:baseline;
  gap:8px;
  margin-right:auto;
  text-decoration:none;
}

.brand-mark{
  font-family:var(--mono);
  font-weight:600;
  font-size:14px;
  letter-spacing:0.06em;
  background:var(--ink);
  color:var(--surface);
  padding:3px 7px;
  border-radius:5px;
}

.brand-name{
  font-weight:600;
  font-size:15px;
  color:var(--ink-soft);
}

.app-switch{
  display:flex;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:999px;
  padding:3px;
  gap:2px;
}

.app-tab{
  text-decoration:none;
  font-size:13px;
  font-weight:600;
  padding:7px 14px;
  border-radius:999px;
  color:var(--ink-soft);
}

.app-tab.activa{
  background:var(--ink);
  color:var(--surface);
}

.btn{
  font-family:var(--sans);
  font-size:13px;
  font-weight:600;
  padding:9px 14px;
  border-radius:var(--radius-sm);
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  cursor:pointer;
}
.btn:hover{border-color:var(--ink-faint);}
.btn-primary{background:var(--accent);color:#fff;border-color:transparent;}
.btn-primary:hover{background:var(--accent-dark);}

main{
  max-width:1400px;
  margin:auto;
  padding:16px 20px;
}

.panell-filtres{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:14px 16px;
  margin-bottom:14px;
}

.cerca-global{
  width:100%;
  padding:11px 12px;
  font-size:14px;
  font-family:var(--sans);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  background:var(--bg);
  box-sizing:border-box;
  margin-bottom:10px;
}
.cerca-global:focus{outline:2px solid var(--accent);outline-offset:-1px;}

.fila-filtres{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
}

.filtre-multi{
  position:relative;
}

.filtre-boto{
  font-family:var(--sans);
  font-size:12.5px;
  font-weight:600;
  padding:7px 10px;
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  background:var(--surface);
  color:var(--ink-soft);
  cursor:pointer;
  white-space:nowrap;
}

.filtre-boto.actiu{
  border-color:var(--accent);
  color:var(--accent-dark);
  background:#E1F1F1;
}

.filtre-boto:hover{border-color:var(--ink-faint);}

.filtre-panell{
  display:none;
  position:absolute;
  top:calc(100% + 4px);
  left:0;
  z-index:20;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  box-shadow:var(--shadow);
  padding:8px;
  min-width:180px;
  max-height:260px;
  overflow-y:auto;
}

.filtre-panell.obert{display:block;}

.filtre-panell-accions{
  display:flex;
  gap:10px;
  padding-bottom:6px;
  margin-bottom:6px;
  border-bottom:1px solid var(--line);
}

.filtre-panell-accions a{
  font-size:11.5px;
  font-weight:600;
  color:var(--accent);
  text-decoration:none;
  cursor:pointer;
}

.filtre-opcio{
  display:flex;
  align-items:center;
  gap:7px;
  padding:4px 2px;
  font-size:12.5px;
  cursor:pointer;
  white-space:nowrap;
}

.filtre-opcio input{margin:0;cursor:pointer;}

.contador{
  margin-left:auto;
  font-family:var(--mono);
  font-size:12.5px;
  color:var(--ink-soft);
  white-space:nowrap;
}

.taula-wrap{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:auto;
  max-height:72vh;
}

table{
  border-collapse:collapse;
  width:100%;
  font-size:13px;
}

thead th{
  position:sticky;
  top:0;
  background:var(--ink);
  color:var(--surface);
  text-align:left;
  padding:9px 10px;
  font-size:11.5px;
  text-transform:uppercase;
  letter-spacing:.03em;
  cursor:pointer;
  white-space:nowrap;
  z-index:1;
}
thead th:hover{background:var(--accent-dark);}
thead th .fletxa{opacity:.6;font-size:10px;margin-left:3px;}

thead th{position:sticky;}
thead th .capcalera-inner{
  display:flex;
  align-items:center;
  gap:6px;
}
thead th .amagar-columna{
  opacity:0;
  font-size:12px;
  font-weight:400;
  padding:0 3px;
  border-radius:3px;
  margin-left:auto;
}
thead th:hover .amagar-columna{opacity:.7;}
thead th .amagar-columna:hover{opacity:1 !important;background:rgba(255,255,255,0.2);}

.fila-columnes-ocultes{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  align-items:center;
  margin-bottom:10px;
  font-size:12px;
  color:var(--ink-soft);
}

.chip-columna-oculta{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px 10px;
  cursor:pointer;
  font-size:12px;
}
.chip-columna-oculta:hover{border-color:var(--accent);color:var(--accent-dark);}

tbody td{
  padding:7px 10px;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
  max-width:280px;
  overflow:hidden;
  text-overflow:ellipsis;
}

tbody tr:hover td{background:var(--bg);}

tbody tr.fila-alerta td{background:var(--danger-soft);}
tbody tr.fila-alerta:hover td{background:#f7d3d0;}

tbody tr.fila-acabada td{background:#E5F5EA;}
tbody tr.fila-acabada:hover td{background:#d3ecda;}

.badge-si{
  display:inline-block;
  font-size:11px;
  font-weight:600;
  padding:2px 8px;
  border-radius:999px;
  background:#E5F5EA;
  color:var(--ok);
}

.buit{
  text-align:center;
  padding:40px;
  color:var(--ink-soft);
}

.estat{
  text-align:center;
  padding:12px;
  color:var(--ink-soft);
  font-size:13px;
}

</style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./">
      <span class="brand-mark">JFA</span>
      <span class="brand-name">Instalacions</span>
    </a>
    <nav class="app-switch">
      <a class="app-tab" href="./">Inventari</a>
      <a class="app-tab" href="./mapa.html">Mapa</a>
      <a class="app-tab activa" href="./progres.html">Progrés sondes</a>
    </nav>
    <button class="btn" onclick="carregarDades()">🔄 Actualitzar</button>
    <button class="btn" onclick="exportarExcelColors()">🎨 Exportar Excel (amb colors)</button>
    <button class="btn btn-primary" onclick="exportarCSV()">⬇️ Exportar CSV</button>
  </div>
</header>

<main>

  <div class="panell-filtres">
    <input id="cercaGlobal" class="cerca-global" placeholder="Cercar en qualsevol columna… (codi, observacions, tipus…)" oninput="aplicarFiltres()">
    <div id="filaFiltres" class="fila-filtres">
      <span class="contador" id="contador"></span>
    </div>
  </div>

  <div id="filaColumnesOcultes" class="fila-columnes-ocultes" style="display:none;"></div>

  <div class="taula-wrap">
    <table>
      <thead id="capcalera"></thead>
      <tbody id="cosTaula"></tbody>
    </table>
    <div id="estatCarrega" class="estat">Carregant…</div>
  </div>

</main>

<script>

const API =
"https://script.google.com/macros/s/AKfycbzz8jwBBYvxLJBdYlf6OrTzPBKK_ojTu4D5w2LZsxVMksLo3-WBk6EUFIFBEWTEVBKNzA/exec";

let headers = [];
let columnesVisibles = []; // índices de columnas con cabecera no vacía
let filasCompletas = [];   // [{ valores:[...], colorFondo }]
let filasFiltradas = [];
let filtresColumna = {};   // índice columna -> Set de valores marcados (vacío = sin filtrar)
let ordreColumna = null;
let ordreAscendent = true;
let idxAcabat = -1; // índice de la columna "Acabat", para marcar las filas en verde

// Columnas que el usuario ha decidido ocultar a mano (por nombre, para que
// se recuerde entre sesiones aunque cambie el orden de las columnas)
let columnesOcultesManual = new Set(JSON.parse(localStorage.getItem("progresColumnesOcultes") || "[]"));

function columnesMostrades(){
  return columnesVisibles.filter(i => !columnesOcultesManual.has(headers[i]));
}

async function carregarDades(intent){

  intent = intent || 1;

  document.getElementById("estatCarrega").style.display = "block";
  document.getElementById("estatCarrega").textContent =
    intent === 1 ? "Carregant…" : "Carregant… (intent " + intent + " de 4)";

  try{

    const r = await fetch(API + "?accion=progresSondes");

    if(!r.ok){
      throw new Error("HTTP " + r.status);
    }

    const dades = await r.json();

    if(!dades.ok){
      document.getElementById("estatCarrega").textContent = "Error carregant les dades: " + (dades.mensaje || "desconegut");
      return;
    }

    headers = dades.headers;
    idxAcabat = headers.findIndex(h => String(h || "").trim().toLowerCase() === "acabat");

    const columnesOcultes = ["lloc", "completats:"];

    columnesVisibles = headers
      .map((h, i) => i)
      .filter(i => {
        const nom = String(headers[i] || "").trim();
        if(nom === "") return false;                          // sin cabecera
        if(columnesOcultes.includes(nom.toLowerCase())) return false; // Lloc / Completats:
        if(/^\d+$/.test(nom)) return false;                    // cabecera residual tipo "50"
        return true;
      });

    filasCompletas = dades.filas;

    construirCapcalera();
    construirFiltresColumna();
    aplicarFiltres();
    renderColumnesOcultesChips();

    document.getElementById("estatCarrega").style.display = "none";

  }catch(error){
    console.error("Error carregant progrés sondes (intent " + intent + "):", error);

    // Reintentamos con más margen cada vez, por si el arranque en frío
    // de Apps Script tarda más de lo habitual
    if(intent < 4){
      setTimeout(() => carregarDades(intent + 1), intent * 2500);
      return;
    }

    document.getElementById("estatCarrega").innerHTML =
      "Error de comunicació (" + escapeHtml(String(error.message || error)) + ") " +
      "<button class=\"btn\" style=\"margin-left:8px;\" onclick=\"carregarDades()\">Tornar a provar</button>";
  }
}

function construirCapcalera(){

  const thead = document.getElementById("capcalera");
  thead.innerHTML = "<tr>" + columnesMostrades().map(i => `
    <th onclick="ordenarPer(${i})">
      <div class="capcalera-inner">
        <span>${escapeHtml(headers[i])}</span>
        <span class="fletxa" id="fletxa-${i}"></span>
        <span class="amagar-columna" title="Amagar aquesta columna" onclick="amagarColumna(event, ${i})">✕</span>
      </div>
    </th>
  `).join("") + "</tr>";
}

function amagarColumna(ev, indice){
  ev.stopPropagation();
  columnesOcultesManual.add(headers[indice]);
  desarColumnesOcultes();
  refrescarVistaColumnes();
}

function mostrarColumna(indice){
  columnesOcultesManual.delete(headers[indice]);
  desarColumnesOcultes();
  refrescarVistaColumnes();
}

function renderColumnesOcultesChips(){

  const cont = document.getElementById("filaColumnesOcultes");

  const ocultes = columnesVisibles.filter(i => columnesOcultesManual.has(headers[i]));

  if(!ocultes.length){
    cont.style.display = "none";
    cont.innerHTML = "";
    return;
  }

  cont.style.display = "flex";
  cont.innerHTML = "Columnes amagades: " + ocultes.map(i =>
    `<span class="chip-columna-oculta" onclick="mostrarColumna(${i})">${escapeHtml(headers[i])} ✕</span>`
  ).join("");
}

// Detecta qué columnas conviene mostrar como desplegable (pocos valores
// distintos) y genera los filtros automáticamente
function construirFiltresColumna(){

  const cont = document.getElementById("filaFiltres");
  cont.innerHTML = "";

  columnesVisibles.forEach(i => {

    const valoresUnicos = new Set();

    filasCompletas.forEach(f => {
      const v = String(f.valores[i] ?? "").trim();
      if(v) valoresUnicos.add(v);
    });

    // Solo columnas "categóricas": entre 2 y 20 valores distintos
    if(valoresUnicos.size < 2 || valoresUnicos.size > 20) return;

    if(!filtresColumna[i]) filtresColumna[i] = new Set();

    const wrap = document.createElement("div");
    wrap.className = "filtre-multi";

    const boto = document.createElement("button");
    boto.type = "button";
    boto.className = "filtre-boto";
    boto.textContent = headers[i];
    boto.onclick = (ev) => {
      ev.stopPropagation();
      const obert = panell.classList.contains("obert");
      document.querySelectorAll(".filtre-panell.obert").forEach(p => p.classList.remove("obert"));
      if(!obert) panell.classList.add("obert");
    };

    const panell = document.createElement("div");
    panell.className = "filtre-panell";
    panell.onclick = (ev) => ev.stopPropagation();

    const accions = document.createElement("div");
    accions.className = "filtre-panell-accions";
    accions.innerHTML = `<a href="#" data-accio="tots">Tots</a><a href="#" data-accio="cap">Cap</a>`;
    accions.querySelector('[data-accio="tots"]').onclick = (ev) => {
      ev.preventDefault();
      panell.querySelectorAll("input[type=checkbox]").forEach(c => c.checked = true);
      actualizarFiltreColumna(i, panell, boto);
    };
    accions.querySelector('[data-accio="cap"]').onclick = (ev) => {
      ev.preventDefault();
      panell.querySelectorAll("input[type=checkbox]").forEach(c => c.checked = false);
      actualizarFiltreColumna(i, panell, boto);
    };
    panell.appendChild(accions);

    Array.from(valoresUnicos).sort().forEach(v => {
      const opcio = document.createElement("label");
      opcio.className = "filtre-opcio";
      const check = document.createElement("input");
      check.type = "checkbox";
      check.value = v;
      check.checked = filtresColumna[i].has(v);
      check.onchange = () => actualizarFiltreColumna(i, panell, boto);
      opcio.appendChild(check);
      opcio.appendChild(document.createTextNode(v));
      panell.appendChild(opcio);
    });

    wrap.appendChild(boto);
    wrap.appendChild(panell);
    cont.appendChild(wrap);

    actualizarEtiquetaBoto(i, boto);
  });

  const contador = document.createElement("span");
  contador.className = "contador";
  contador.id = "contador";
  cont.appendChild(contador);
}

// Se registra una sola vez: cierra cualquier panel de filtro abierto al
// tocar fuera de él
if(!window._listenerFiltresRegistrat){
  document.addEventListener("click", () => {
    document.querySelectorAll(".filtre-panell.obert").forEach(p => p.classList.remove("obert"));
  });
  window._listenerFiltresRegistrat = true;
}

function actualizarFiltreColumna(indice, panell, boto){

  const seleccionats = new Set(
    Array.from(panell.querySelectorAll("input[type=checkbox]:checked")).map(c => c.value)
  );

  filtresColumna[indice] = seleccionats;
  actualizarEtiquetaBoto(indice, boto);
  aplicarFiltres();
}

function actualizarEtiquetaBoto(indice, boto){
  const n = filtresColumna[indice] ? filtresColumna[indice].size : 0;
  // Sin nada marcado, el filtro queda "colapsado": solo el nombre de la columna
  boto.textContent = n > 0 ? `${headers[indice]} (${n})` : headers[indice];
  boto.classList.toggle("actiu", n > 0);
}

function aplicarFiltres(){

  const cercaGlobal = document.getElementById("cercaGlobal").value.trim().toLowerCase();

  filasFiltradas = filasCompletas.filter(f => {

    for(const idx in filtresColumna){
      const seleccionats = filtresColumna[idx];
      if(seleccionats && seleccionats.size > 0){
        const valor = String(f.valores[idx] ?? "").trim();
        if(!seleccionats.has(valor)) return false;
      }
    }

    if(cercaGlobal){
      const coincide = f.valores.some(v => String(v ?? "").toLowerCase().includes(cercaGlobal));
      if(!coincide) return false;
    }

    return true;
  });

  if(ordreColumna !== null){
    filasFiltradas.sort((a, b) => {
      const va = a.valores[ordreColumna] ?? "";
      const vb = b.valores[ordreColumna] ?? "";
      const cmp = String(va).localeCompare(String(vb), undefined, { numeric: true });
      return ordreAscendent ? cmp : -cmp;
    });
  }

  renderTaula();
}

function desarColumnesOcultes(){
  localStorage.setItem("progresColumnesOcultes", JSON.stringify(Array.from(columnesOcultesManual)));
}

function refrescarVistaColumnes(){
  construirCapcalera();
  renderTaula();
  renderColumnesOcultesChips();
}

function ordenarPer(indice){

  if(ordreColumna === indice){
    ordreAscendent = !ordreAscendent;
  }else{
    ordreColumna = indice;
    ordreAscendent = true;
  }

  columnesVisibles.forEach(i => {
    document.getElementById("fletxa-" + i).textContent = "";
  });
  document.getElementById("fletxa-" + indice).textContent = ordreAscendent ? "▲" : "▼";

  aplicarFiltres();
}

function esColorAlerta(color){
  if(!color) return false;
  const c = color.toLowerCase();
  return c === "#ff0000" || c === "#e06666" || c === "#b30000" || c === "#f4cccc";
}

function renderTaula(){

  const tbody = document.getElementById("cosTaula");
  const cols = columnesMostrades();

  if(!filasFiltradas.length){
    tbody.innerHTML = `<tr><td colspan="${cols.length}"><div class="buit">Cap fila coincideix amb el filtre</div></td></tr>`;
    document.getElementById("contador").textContent = "0 de " + filasCompletas.length + " files";
    return;
  }

  tbody.innerHTML = filasFiltradas.map(f => {

    let claseFila = "";
    if(esColorAlerta(f.colorFondo)){
      claseFila = "fila-alerta";
    }else if(idxAcabat !== -1 && f.valores[idxAcabat] === true){
      claseFila = "fila-acabada";
    }

    const celdas = cols.map(i => {

      let valor = f.valores[i];

      if(typeof valor === "boolean"){
        return `<td>${valor ? '<span class="badge-si">Sí</span>' : ""}</td>`;
      }

      return `<td title="${escapeHtml(valor)}">${escapeHtml(valor === "" || valor === null ? "-" : valor)}</td>`;
    }).join("");

    return `<tr class="${claseFila}">${celdas}</tr>`;

  }).join("");

  document.getElementById("contador").textContent = filasFiltradas.length + " de " + filasCompletas.length + " files";
}

function exportarCSV(){

  if(!filasFiltradas.length){
    alert("No hi ha files per exportar amb aquest filtre");
    return;
  }

  const cols = columnesMostrades();
  const capcaleres = cols.map(i => headers[i]);
  const linies = [capcaleres];

  filasFiltradas.forEach(f => {
    linies.push(cols.map(i => {
      const v = f.valores[i];
      if(typeof v === "boolean") return v ? "Sí" : "No";
      if(typeof v === "number") return String(v).replace(".", ",");
      return v === null || v === undefined ? "" : v;
    }));
  });

  const csv = linies.map(fila =>
    fila.map(celda => {
      const texto = String(celda).replaceAll('"', '""');
      return /[",\n;]/.test(texto) ? `"${texto}"` : texto;
    }).join(";")
  ).join("\n");

  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "progres-sondes-" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();

  URL.revokeObjectURL(url);
}

// Genera un .xls (formato HTML, que Excel entiende y abre con normalidad)
// conservando el rojo de las problemàtiques y el verde de las acabades
function exportarExcelColors(){

  if(!filasFiltradas.length){
    alert("No hi ha files per exportar amb aquest filtre");
    return;
  }

  const cols = columnesMostrades();

  const capceleraHtml = "<tr>" + cols.map(i =>
    `<th style="background:#10242B;color:#fff;padding:6px 8px;text-align:left;">${escapeHtml(headers[i])}</th>`
  ).join("") + "</tr>";

  const filesHtml = filasFiltradas.map(f => {

    let colorFons = "";
    if(esColorAlerta(f.colorFondo)){
      colorFons = "#F4CCCC";
    }else if(idxAcabat !== -1 && f.valores[idxAcabat] === true){
      colorFons = "#E5F5EA";
    }

    const estilFila = colorFons ? ` style="background:${colorFons};"` : "";

    const celdes = cols.map(i => {
      const v = f.valores[i];
      let texto;
      if(typeof v === "boolean") texto = v ? "Sí" : "No";
      else if(typeof v === "number") texto = String(v).replace(".", ",");
      else texto = (v === null || v === undefined || v === "") ? "" : v;
      return `<td style="padding:5px 8px;border:1px solid #DCE4E2;">${escapeHtml(texto)}</td>`;
    }).join("");

    return `<tr${estilFila}>${celdes}</tr>`;
  }).join("");

  const html = `
    <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">
    <head>
      <meta charset="utf-8">
      <!--[if gte mso 9]>
      <xml>
        <x:ExcelWorkbook>
          <x:ExcelWorksheets>
            <x:ExcelWorksheet>
              <x:Name>Progrés sondes</x:Name>
              <x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>
            </x:ExcelWorksheet>
          </x:ExcelWorksheets>
        </x:ExcelWorkbook>
      </xml>
      <![endif]-->
    </head>
    <body>
      <table>
        <thead>${capceleraHtml}</thead>
        <tbody>${filesHtml}</tbody>
      </table>
    </body>
    </html>
  `;

  const blob = new Blob(["\uFEFF" + html], { type: "application/vnd.ms-excel;charset=utf-8;" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "progres-sondes-" + new Date().toISOString().slice(0,10) + ".xls";
  a.click();

  URL.revokeObjectURL(url);
}

function escapeHtml(valor){
  return String(valor ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#39;");
}

carregarDades();

</script>

</body>
</html>
